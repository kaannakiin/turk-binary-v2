# Copy to config.toml and edit. See docs/configuration.md for every key.
#
# Endpoints and tokens are NOT read from this file. Set them in the environment:
#   TB_RPC_URL       JSON-RPC endpoint (required)
#   TB_GRPC_URL      Yellowstone gRPC endpoint (required)
#   TB_GRPC_X_TOKEN  Yellowstone x-token (optional)

stats_interval_secs = 10

[universe]
# Pools whose BOTH tokens are in this list are watched, on every enabled DEX.
mints = [
  "So11111111111111111111111111111111111111112",  # Wrapped SOL
  "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC
]
# Extra pools to watch by address, added on top of what `mints` finds.
pools = []
# Empty = every verified DEX. Names are listed in docs/dexes.md.
allowed_dexes = []
blocked_dexes = []

[rpc]
commitment = "processed"   # processed | confirmed | finalized
timeout_ms = 10000
max_in_flight = 8
max_rps = 8                # stay under the provider's quota; 0 = no pacing

[rpc.retry]
max_attempts = 5
base_delay_ms = 100
max_delay_ms = 5000

[grpc]
commitment = "processed"   # processed | confirmed | finalized
streams = 12
slot_source = "auto"       # auto | slots | blocks_meta (run `just probe` once per provider)
max_pubkeys_per_filter = 100
max_txn_pubkeys_per_filter = 100
compression = "gzip"       # none | gzip | zstd
recv_timeout_ms = 10000
max_message_delay_ms = 10000
connect_timeout_ms = 10000
filter_flush_ms = 200

[grpc.reconnect]
max_attempts = 0           # 0 = retry forever
base_delay_ms = 500
max_delay_ms = 30000

[sync]
settle_slots = 4
repair_concurrency = 2
audit_interval_ms = 10000
stream_swap_accounts = true
txn_max_hold_ms = 5000

[route]
probe_amount = 1000000    # watch quotes this raw amount both ways through every pool each stats tick; 0 = off

[threads]
pipeline = 0              # threads that read the gRPC streams, apply writes and decode pools; 0 = automatic
search = 0                # serve only: route search threads; 0 = a quarter of the cores

[server]                      # serve only
api_addr = "127.0.0.1:8080"   # POST /quote, /swap-instructions, /swap
ops_addr = "127.0.0.1:9100"   # /health and /ready
drain_delay_ms = 0            # /ready answers 503 this long before the listeners close
read_timeout_ms = 5000        # headers (and the API body) must arrive within this
shutdown_timeout_ms = 5000

[server.ready]
startup_percent = 90          # share of eligible pools ready before /ready first turns 200
floor_percent = 50            # once ready, /ready fails again only below this share
max_clock_stall_ms = 10000    # /ready fails once the Clock's slot has not moved for this long

[server.quote]
default_max_hops = 3
max_hops = 4
max_operations = 16            # maximum operations in a routed execution flow
max_quotes = 100000           # work budget of one search, not a deadline
per_pair = 2                  # pools kept per pair while searching; 0 = all
max_arrays = 8
unique_dex_ids = []           # DEX program IDs unique by default in cyclic-arbitrage requests
timeout_ms = 2000
max_queued = 32               # searches waiting for a thread before OVERLOADED

[server.swap]
default_slippage_bps = 50     # when a request gives no slippagePercent
max_quote_age_slots = 32      # a quoteResponse older than this answers QUOTE_EXPIRED
blockhash_refresh_ms = 2000   # getLatestBlockhash cadence for /swap
max_blockhash_age_ms = 20000  # /swap answers NO_BLOCKHASH past this

[grpc.transport]
http2_keep_alive_interval_ms = 15000
keep_alive_timeout_ms = 5000
tcp_nodelay = true
