[package]
name = "quoter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["pumpswap", "raydium-amm-v4", "raydium-cpmm", "raydium-clmm", "whirlpool", "damm-v2", "dlmm", "damm-v1"]
pumpswap = []
raydium-amm-v4 = ["dep:raydium_amm", "dep:bytemuck"]
raydium-cpmm = ["dep:raydium-cp-swap", "dep:anchor-lang-032", "dep:bytemuck"]
raydium-clmm = ["dep:raydium-clmm", "dep:anchor-lang-032", "dep:bytemuck"]
whirlpool = ["dep:orca_whirlpools_client", "dep:orca_whirlpools_core"]
damm-v2 = ["dep:damm-v2-sdk", "dep:cp-amm", "dep:bytemuck"]
dlmm = ["dep:commons", "dep:solana-sdk-2"]
damm-v1 = ["dep:ethnum", "dep:uint"]

[dependencies]
anchor-lang-032 = { workspace = true, optional = true }
raydium-cp-swap = { workspace = true, optional = true }
raydium-clmm = { workspace = true, optional = true }
orca_whirlpools_client = { workspace = true, optional = true }
orca_whirlpools_core = { workspace = true, optional = true }
damm-v2-sdk = { workspace = true, optional = true }
cp-amm = { workspace = true, optional = true }
commons = { workspace = true, optional = true }
solana-sdk-2 = { workspace = true, optional = true }
ethnum = { workspace = true, optional = true }
uint = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
raydium_amm = { workspace = true, optional = true }
dex.workspace = true
domain.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
thiserror.workspace = true

[dev-dependencies]
base64.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
spl-token-2022-interface.workspace = true

[lints]
workspace = true
