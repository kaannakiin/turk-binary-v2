name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --doc --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  onchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --manifest-path onchain/Cargo.toml --all --check
      - run: cargo clippy --manifest-path onchain/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --manifest-path onchain/Cargo.toml --locked

  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NO_DNA: "1"
      AGAVE_VERSION: v4.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            oracle -> target
            onchain -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: actions/cache@v4
        id: agave
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}
      - if: steps.agave.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Fetch the program bytecode programs.tsv pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="oracle-programs-$(sha256sum oracle/programs/programs.tsv | cut -c1-12)"
          gh release download "$tag" --pattern '*.so' --dir oracle/programs
      - run: just replay-check
      - if: always()
        run: cat target/replay-check/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-report
          path: target/replay-check/replay-report.json

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
