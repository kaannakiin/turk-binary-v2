[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
dex = { path = "crates/dex" }
domain = { path = "crates/domain" }
grpc = { path = "crates/grpc" }
market = { path = "crates/market" }
rpc = { path = "crates/rpc" }

ahash = "0.8.12"
anyhow = "1.0.104"
arc-swap = "1.9.2"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
solana-account-decoder-client-types = "=4.3.0"
solana-commitment-config = "3.1.1"
solana-pubkey = "4.4.0"
solana-rpc-client = "=4.3.0"
solana-rpc-client-api = "=4.3.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yellowstone-grpc-client = "13.5.1"
yellowstone-grpc-proto = { version = "12.7.0", features = ["account-data-as-bytes"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
